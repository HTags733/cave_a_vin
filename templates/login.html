<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>MaCave - Connexion</title>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e1e1e; padding: 30px; border: 1px solid #333; width: 300px; border-radius: 8px; }
        input { width: 100%; padding: 10px; margin: 10px 0; background: #2a2a2a; border: 1px solid #444; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #c5a059; border: none; color: #121212; font-weight: bold; cursor: pointer; }
        button:hover { background: #d4af37; }
        a { color: #c5a059; text-decoration: none; font-size: 0.9em; }
        .flash { color: #ff6b6b; font-size: 0.85em; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>[ MaCave ] Connexion</h2>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="flash">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        <form method="POST" action="/login">
            <input type="text" name="username" placeholder="Identifiant" required>
            <input type="password" name="password" placeholder="Mot de passe" required>
            <button type="submit">Se connecter</button>
        </form>
        <p style="text-align:center; margin-top:15px;"><a href="/register">Créer un compte</a></p>
    </div>
</body>
</html>
